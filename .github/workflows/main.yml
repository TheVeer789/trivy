name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install Trivy
      run: |
        sudo apt-get install wget -y
        wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.50.2_Linux-64bit.deb
        sudo dpkg -i trivy_0.50.2_Linux-64bit.deb

    - name: Scan Docker Image
      run: |
        docker build -t devops-app .
        trivy image devops-app
    - name: Fail on High Vulnerabilities
      run: trivy image --exit-code 1 --severity HIGH,CRITICAL devops-app
